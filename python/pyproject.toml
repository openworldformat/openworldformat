[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openworldformat"
version = "0.1.0"
description = "The Open World Format research package: parse and fold a .world in pure Python, no engine required."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
  "3d",
  "world",
  "gltf",
  "scene",
  "format",
  "session",
  "crdt",
  "replay",
  "benchmark",
  "dataset",
]
urls = { Repository = "https://github.com/openworldformat/openworldformat", Documentation = "https://openworldformat.org" }

[tool.setuptools]
packages = ["openworldformat"]
