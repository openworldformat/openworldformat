[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openworldformat"
version = "0.4.1"
description = "The Open World Format research package: parse and fold a .world in pure Python, no engine required."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "The Open World Format contributors" }]
keywords = [
  "3d",
  "world",
  "gltf",
  "scene",
  "format",
  "session",
  "crdt",
  "replay",
  "benchmark",
  "dataset",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: File Formats",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = { Repository = "https://github.com/openworldformat/openworldformat", Documentation = "https://openworldformat.org", Homepage = "https://openworldformat.org" }

[tool.setuptools]
packages = ["openworldformat"]
