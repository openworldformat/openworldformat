# Publish the Python package to PyPI when a `python-vX.Y.Z` tag is pushed.
#
# Trusted Publishing (OIDC): no token lives in this repository. PyPI takes
# the upload because the project's Publishing settings name this
# repository, this workflow file and the `pypi` environment, and GitHub
# vouches for the run. Set up once, on both sides:
#   - pypi.org -> openworldformat -> Manage -> Publishing -> add a GitHub
#     publisher: owner `openworldformat`, repository `openworldformat`,
#     workflow `publish-python.yml`, environment `pypi`.
#   - github.com -> this repository -> Settings -> Environments -> `pypi`
#     (with required reviewers, if an upload should wait for a second
#     look).
#
# To release: bump `version` in python/pyproject.toml, commit, then
#   git tag -a python-v0.4.5 -m "openworldformat (Python) 0.4.5 — <what>"
#   git push origin python-v0.4.5
# The build job refuses a tag whose number is not pyproject's, runs the
# tests, builds the sdist and the wheel and checks their metadata; the
# publish job uploads them. PyPI refuses a version it already has, so a
# re-run of a published tag fails loudly and overwrites nothing, and a tag
# on a commit without this file (python-v0.4.4, uploaded by hand) runs
# nothing at all.
name: Publish Python

on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag names pyproject's version
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::the tag says $tag, python/pyproject.toml says $version"
            exit 1
          fi
      - run: python -m unittest discover -s tests -t .
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openworldformat/
    permissions:
      id-token: write # the OIDC token PyPI trusts; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
